<!doctype html>
<html><head><meta charset="utf-8"><title>Colors · Royal Oak</title>
<link rel="stylesheet" href="_shell.css"/>
<style>
.grid-pal { display:grid; grid-template-columns: repeat(6,1fr); gap:8px; }
.swatch { color: #1A0F08; }
.swatch.dark { color: #F4E9D6; }
.section-h { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 700; color: var(--fg-1); margin: 0 0 8px; }
.sub { color: var(--fg-2); font-size: 12px; margin-bottom: 14px; font-family: 'Lora', serif; font-style: italic; }
</style></head>
<body class="card-root cc" data-theme="royal-oak">
  <div class="section-h">Royal Oak</div>
  <div class="sub">Walnut, deep felt, brass, ivory cards. Warm club lane.</div>
  <div class="label-cap" style="margin-bottom:6px">Surfaces</div>
  <div class="grid-pal" style="margin-bottom:14px">
    <div class="swatch dark" style="background:#1A0F08"><span class="name">bg</span><span class="hex">#1A0F08</span></div>
    <div class="swatch dark" style="background:#26170D"><span class="name">surface</span><span class="hex">#26170D</span></div>
    <div class="swatch dark" style="background:#3A2412"><span class="name">surf-alt</span><span class="hex">#3A2412</span></div>
    <div class="swatch dark" style="background:#0E3D24"><span class="name">felt</span><span class="hex">#0E3D24</span></div>
    <div class="swatch dark" style="background:#5A3A1F"><span class="name">felt-rim</span><span class="hex">#5A3A1F</span></div>
    <div class="swatch" style="background:#F8EFD9"><span class="name">card-face</span><span class="hex">#F8EFD9</span></div>
  </div>
  <div class="label-cap" style="margin-bottom:6px">Accents · Text · Status</div>
  <div class="grid-pal">
    <div class="swatch" style="background:#C9A24B"><span class="name">brass</span><span class="hex">#C9A24B</span></div>
    <div class="swatch" style="background:#8C6E2E;color:#F4E9D6"><span class="name">brass-dim</span><span class="hex">#8C6E2E</span></div>
    <div class="swatch" style="background:#E9B97A"><span class="name">amber</span><span class="hex">#E9B97A</span></div>
    <div class="swatch" style="background:#7BC97F"><span class="name">win</span><span class="hex">#7BC97F</span></div>
    <div class="swatch dark" style="background:#C24A3D"><span class="name">lose</span><span class="hex">#C24A3D</span></div>
    <div class="swatch" style="background:#E0A23A"><span class="name">warn</span><span class="hex">#E0A23A</span></div>
  </div>
</body></html>
