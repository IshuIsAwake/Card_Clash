<!doctype html>
<html><head><meta charset="utf-8"><title>Spacing</title>
<link rel="stylesheet" href="_shell.css"/>
<style>.bars{display:flex;gap:6px;align-items:flex-end}.bar{background:var(--accent);min-width:24px;color:var(--accent-on);font-family:var(--font-mono);font-size:10px;text-align:center;padding:4px 0}</style>
</head><body class="card-root cc" data-theme="dev">
  <div class="label-cap" style="margin-bottom:8px">4-pt grid · token scale</div>
  <div class="bars">
    <div class="bar" style="height:4px">4</div>
    <div class="bar" style="height:8px">8</div>
    <div class="bar" style="height:12px">12</div>
    <div class="bar" style="height:16px">16</div>
    <div class="bar" style="height:20px">20</div>
    <div class="bar" style="height:24px">24</div>
    <div class="bar" style="height:32px">32</div>
    <div class="bar" style="height:40px">40</div>
    <div class="bar" style="height:56px">56</div>
    <div class="bar" style="height:72px">72</div>
    <div class="bar" style="height:96px">96</div>
  </div>
  <div style="margin-top:18px;color:#B0B0B0;font-size:13px;font-family:'Inter'">Touch targets ≥ 44pt. Action column = 56pt wide. Hand strip pad = 16pt.</div>
</body></html>
