<!doctype html>
<html><head><meta charset="utf-8"><title>Colors · Balatro</title>
<link rel="stylesheet" href="_shell.css"/>
<style>
.grid-pal { display:grid; grid-template-columns: repeat(6,1fr); gap:8px; }
.swatch { color: #1A1A1A; border-radius: 2px !important; box-shadow: 2px 2px 0 0 #000; }
.swatch.dark { color: #fff; }
.section-h { font-family: 'Press Start 2P', monospace; font-size: 16px; color: var(--bal-yellow); margin: 0 0 8px; text-shadow: 2px 2px 0 #000; }
.sub { color: #fff; font-size: 16px; margin-bottom: 14px; font-family: 'VT323', monospace; }
.label-cap { color: var(--bal-yellow) !important; font-family: 'Press Start 2P', monospace !important; font-size: 9px !important; }
</style></head>
<body class="card-root cc" data-theme="balatro">
  <div class="section-h">BALATRO</div>
  <div class="sub">Pixel cards. Painterly green felt. Lo-fi UI panels.</div>
  <div class="label-cap" style="margin-bottom:6px">Surfaces · Felt</div>
  <div class="grid-pal" style="margin-bottom:14px">
    <div class="swatch dark" style="background:#1B2D24"><span class="name">bg</span><span class="hex">#1B2D24</span></div>
    <div class="swatch dark" style="background:#2A553C"><span class="name">felt</span><span class="hex">#2A553C</span></div>
    <div class="swatch dark" style="background:#3A6A4A"><span class="name">felt-lt</span><span class="hex">#3A6A4A</span></div>
    <div class="swatch dark" style="background:#2D2E33"><span class="name">panel</span><span class="hex">#2D2E33</span></div>
    <div class="swatch dark" style="background:#1B1C20"><span class="name">panel-edge</span><span class="hex">#1B1C20</span></div>
    <div class="swatch" style="background:#F5EFE2"><span class="name">card-face</span><span class="hex">#F5EFE2</span></div>
  </div>
  <div class="label-cap" style="margin-bottom:6px">Pop · Status</div>
  <div class="grid-pal">
    <div class="swatch dark" style="background:#4F6DDE"><span class="name">blue</span><span class="hex">#4F6DDE</span></div>
    <div class="swatch dark" style="background:#D85A3E"><span class="name">red</span><span class="hex">#D85A3E</span></div>
    <div class="swatch" style="background:#E69020"><span class="name">orange</span><span class="hex">#E69020</span></div>
    <div class="swatch" style="background:#F0BD3A"><span class="name">yellow</span><span class="hex">#F0BD3A</span></div>
    <div class="swatch dark" style="background:#B45DA0"><span class="name">purple</span><span class="hex">#B45DA0</span></div>
    <div class="swatch" style="background:#6FB668"><span class="name">green-pop</span><span class="hex">#6FB668</span></div>
  </div>
</body></html>
