<!doctype html>
<html><head><meta charset="utf-8"><title>Brand · Voice</title>
<link rel="stylesheet" href="_shell.css"/>
<style>
.voice { display: grid; grid-template-columns: 1fr; gap: 18px; }
.row-do { display: grid; grid-template-columns: 90px 1fr; gap: 18px; align-items: baseline; }
.kind { font-family: var(--font-heading); font-size: 10px; letter-spacing: var(--tracking-cap); text-transform: uppercase; color: var(--fg-3); padding-top: 4px; }
.eg { color: var(--fg-1); font-family: var(--font-heading); font-weight: 700; font-size: 16px; line-height: 1.3; letter-spacing: var(--tracking-cap); text-transform: uppercase; }
.eg.title { font-size: 14px; }
.eg.helper { font-family: var(--font-body); font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--fg-2); font-size: 14px; }
.eg.button { display: inline-block; padding: 8px 14px; border: 2px solid #fff; color: #fff; }
.eg.cta { background: #fff; color: #000; padding: 10px 14px; display: inline-block; }
.divider { height: 1px; background: rgba(255,255,255,0.08); }
</style></head>
<body class="card-root cc" data-theme="dev">
  <div class="voice">
    <div class="row-do"><div class="kind">Screen<br/>label</div><div class="eg">BLUFF · HOT SEAT</div></div>
    <div class="row-do"><div class="kind">Section<br/>header</div><div class="eg">PASS THE DEVICE</div></div>
    <div class="row-do"><div class="kind">Primary<br/>CTA</div><div><span class="eg cta">I'M PLAYER 1 — CONTINUE</span></div></div>
    <div class="row-do"><div class="kind">Secondary<br/>CTA</div><div><span class="eg button">CALL BLUFF</span></div></div>
    <div class="row-do"><div class="kind">Title<br/>case</div><div class="eg title" style="text-transform:none;letter-spacing:0;font-size:18px">Hot Seat (Offline)</div></div>
    <div class="divider"></div>
    <div class="row-do"><div class="kind">Helper<br/>copy</div><div class="eg helper">Single device. Pass and play.</div></div>
    <div class="row-do"><div class="kind">Helper<br/>copy</div><div class="eg helper">Hand will appear after you continue.</div></div>
    <div class="row-do"><div class="kind">Inline<br/>meta</div><div class="eg helper" style="font-family:var(--font-mono);color:var(--fg-2)">Open Call · WKT &nbsp;·&nbsp; 17 cards · 0W &nbsp;·&nbsp; 40/52</div></div>
  </div>
</body></html>
