<!doctype html>
<html><head><meta charset="utf-8"><title>Buttons</title>
<link rel="stylesheet" href="_shell.css"/>
<style>
.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.col-btn{display:flex;flex-direction:column;gap:8px;padding:14px;background:var(--bg);border-radius:6px}
.btn{display:inline-block;text-align:center;cursor:pointer;font-family:var(--font-heading);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:var(--tracking-cap);padding:12px 14px;border:0;border-radius:var(--r-btn)}
.btn.primary{background:var(--accent);color:var(--accent-on)}
.btn.secondary{background:transparent;color:var(--fg-1);border:2px solid var(--fg-1)}
.btn.disabled{opacity:.4;cursor:not-allowed}
.tag{font-family:var(--font-heading);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--fg-3)}
[data-theme="royal-oak"] .btn.primary{background:#C9A24B;color:#1A0F08}
[data-theme="royal-oak"] .btn.secondary{border-color:#C9A24B;color:#F4E9D6}
[data-theme="neon-pulse"] .btn.primary{background:#00D4FF;color:#0A0512;box-shadow:0 0 14px rgba(0,212,255,.5)}
[data-theme="neon-pulse"] .btn.secondary{border-color:#FF1E8E;color:#FF1E8E;box-shadow:0 0 10px rgba(255,30,142,.3)}
[data-theme="balatro"] .btn{font-family:'Press Start 2P';font-size:9px;letter-spacing:.04em;box-shadow:2px 2px 0 0 #000;border-radius:2px}
[data-theme="balatro"] .btn.primary{background:#E69020;color:#fff;border:2px solid #1B1C20}
[data-theme="balatro"] .btn.secondary{background:#2D2E33;color:#fff;border:2px solid #1B1C20}
[data-theme="dev"] .btn.primary{background:#fff;color:#000}
[data-theme="dev"] .btn.secondary{border-color:#fff;color:#fff}
</style>
</head><body class="card-root cc" data-theme="dev">
  <div class="label-cap" style="margin-bottom:10px">Buttons across the four themes</div>
  <div class="row4">
    <div class="col-btn" data-theme="dev"><span class="tag">Developer</span><div class="btn primary">DEAL</div><div class="btn secondary">SKIP</div><div class="btn primary disabled">CALL BLUFF</div></div>
    <div class="col-btn" data-theme="royal-oak"><span class="tag" style="color:#B8A07C">Royal Oak</span><div class="btn primary">DEAL</div><div class="btn secondary">SKIP</div><div class="btn primary disabled">CALL BLUFF</div></div>
    <div class="col-btn" data-theme="neon-pulse"><span class="tag" style="color:#A89AC9">Neon Pulse</span><div class="btn primary">DEAL</div><div class="btn secondary">SKIP</div><div class="btn primary disabled">CALL BLUFF</div></div>
    <div class="col-btn" data-theme="balatro"><span class="tag" style="color:#F0BD3A">Balatro</span><div class="btn primary">DEAL</div><div class="btn secondary">SKIP</div><div class="btn primary disabled">CALL BLUFF</div></div>
  </div>
</body></html>
